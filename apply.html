<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقديم على وظيفة — إحكام</title><link rel="stylesheet" href="/style.css"><body><main style="max-width:680px;margin:24px auto;padding:16px"><img src="/ehkam-logo-full.png" alt="إحكام" style="max-width:220px"><section class="panel"><h1 id="title">جارٍ تحميل الوظيفة…</h1><p id="info"></p><form id="application" hidden><label>الاسم الكامل<input name="name" required maxlength="150"></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>الجوال (10 أرقام)<input name="phone" type="tel" required pattern="05[0-9]{8}" minlength="10" maxlength="10" dir="ltr"></label><label>معلومات إضافية<textarea name="note" maxlength="2000"></textarea></label><label>السيرة الذاتية PDF أو Word (إلزامي — حتى 2 ميجابايت)<input name="cv" type="file" required accept=".pdf,.doc,.docx"></label><label><input name="consent" type="checkbox" required> أوافق على حفظ بياناتي ومراجعتها لغرض التقديم لهذه الوظيفة.</label><button class="primary">إرسال التقديم</button></form><p id="message" role="status"></p></section></main><script>
const token=location.pathname.split('/').pop(),endpoint='/api/recruitment/'+encodeURIComponent(token),form=document.querySelector('form'),msg=document.querySelector('#message');
fetch(endpoint).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الوظيفة');document.querySelector('#title').textContent=d.title;document.querySelector('#info').textContent=d.company_name+' · '+(d.job_name||d.department)+' · إغلاق التقديم: '+d.closes_on+' · حفظ البيانات حتى: '+d.retention_until;form.hidden=false}).catch(e=>msg.textContent=e.message);
form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{const f=form.cv.files[0];if(!f||f.size>2*1024*1024)throw Error('أرفق سيرة ذاتية PDF أو Word حتى 2 ميجابايت');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.elements.name.value,email:form.email.value,phone:form.phone.value,note:form.note.value,consent:form.consent.checked,cv:{name:f.name,data}})}),out=await r.json();if(!r.ok)throw Error(out.error||'تعذر إرسال التقديم');form.hidden=true;msg.textContent='تم استلام طلبك بنجاح.'}catch(err){msg.textContent=err.message;btn.disabled=false}};
</script></body></html>
