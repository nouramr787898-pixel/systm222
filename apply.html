<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقديم للوظيفة — إحكام المسار</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#173a34;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.brand{width:min(310px,70vw);height:110px;margin:24px auto;display:flex;align-items:center;justify-content:center}.brand img{width:100%;height:auto;display:block;object-fit:contain}main{max-width:810px;margin:0 auto 32px;padding:28px;background:white;border:1px solid #dce6e2;border-radius:18px}h1{margin:0 0 8px}label{display:block;margin:12px 0}input,textarea{display:block;width:100%;border:1px solid #cbd9d4;border-radius:10px;padding:14px;font:inherit}textarea{min-height:100px}.consent{display:flex;align-items:flex-start;gap:10px}.consent input{width:auto;margin-top:10px;flex-shrink:0}button{background:#00523e;color:white;border:0;padding:14px 24px;border-radius:10px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#message{white-space:pre-wrap}#description{white-space:pre-wrap}@media(max-width:600px){main{margin:0 12px 24px;padding:20px}.brand{margin:12px auto}}
</style></head><body><div class="brand"><img src="/ehkam-logo-transparent.png" alt="إحكام المسار"></div><main><h1 id="title">التقديم للوظيفة</h1><p id="description"></p><p id="dates"></p><form id="application" hidden><label>الاسم الكامل<input name="name" maxlength="200" autocomplete="name" required></label><label>البريد الإلكتروني<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>الجوال (10 أرقام)<input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel" required></label><label>معلومات إضافية<textarea name="notes" maxlength="10000"></textarea></label><label>السيرة الذاتية PDF أو Word (إلزامي — حتى 2 ميجابايت)<input name="cv" type="file" accept=".pdf,.doc,.docx" required></label><label class="consent"><input name="consent" type="checkbox" required><span>أوافق على حفظ بياناتي ومراجعتها لغرض التقديم لهذه الوظيفة، وأُقرّ بصحة البيانات المقدَّمة لشركة إحكام المسار.</span></label><button type="submit">إرسال التقديم</button></form><p id="message" role="status"></p></main><script>
const form=document.querySelector('form'),message=document.querySelector('#message'),endpoint='/api'+location.pathname;
(async()=>{try{const res=await fetch(endpoint),job=await res.json();if(!res.ok)throw Error(job.error);document.querySelector('#title').textContent=job.title;document.querySelector('#description').textContent=job.description;document.querySelector('#dates').textContent=`إغلاق التقديم: ${job.closes_on} · حفظ البيانات حتى: ${job.retain_until}`;form.hidden=false}catch(e){message.textContent=e.message}})();
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const file=form.cv.files[0];if(!file||file.size>2*1024*1024)throw Error('أرفق سيرة ذاتية حتى 2 ميجابايت');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('تعذر قراءة الملف'));reader.readAsDataURL(file)});const body={name:form.elements.name.value,email:form.email.value,phone:form.phone.value,notes:form.notes.value,consent:form.consent.checked,cv:{name:file.name,data}};const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),out=await res.json();if(!res.ok)throw Error(out.error);message.textContent=out.message;form.hidden=true}catch(err){message.textContent=err.message}finally{button.disabled=false}};
</script></body></html>
