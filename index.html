<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System أحكام الأعمال</title>

<meta property="og:title" content="System أحكام الأعمال">
<meta property="og:site_name" content="System أحكام الأعمال">

<meta property="og:url" content="https://systemehkam.online/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="System أحكام الأعمال">
<link rel="canonical" href="https://systemehkam.online/"><link rel="icon" href="./favicon.ico"><meta name="theme-color" content="#00513a"><link rel="stylesheet" href="./style.css"></head><body>
<div id="toast" aria-live="polite"></div>
<div id="login" class="login-bg"><form id="loginForm" class="login-card">
<img class="login-logo" src="./ehkam-logo-full.png" alt="شعار إحكام الأعمال"><h1>بوابة إحكام الأعمال</h1><p>اختر نوع حسابك وسجّل الدخول</p>
<div class="role-choices" role="group" aria-label="نوع الحساب">
<label class="role-option"><input type="radio" name="account_role" value="admin" checked><span>المدير</span></label>
<label class="role-option"><input type="radio" name="account_role" value="manager"><span>المشرف</span></label>
<label class="role-option"><input type="radio" name="account_role" value="employee"><span>الموظف</span></label>
</div>
<label>اسم المستخدم<input name="username" required autocomplete="username" placeholder="اسم المستخدم"></label>
<label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" placeholder="كلمة المرور"></label>
<label>رمز تطبيق المصادقة (لو مفعّل)<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><button class="primary" type="submit">تسجيل الدخول</button>
<button type="button" id="forgotPassword" class="ghost" hidden style="margin:8px auto">هل نسيت كلمة المرور؟</button>

</form></div>
<div id="shell" class="hidden"><button id="navBackdrop" class="nav-backdrop" aria-label="إغلاق القائمة" hidden></button><aside class="sidebar" id="appSidebar"><div class="brand"><img class="brand-icon-img" src="./ehkam-icon.png" alt="إحكام"><div><strong>إحكام الأعمال</strong><small>EHKAM HR Portal</small></div></div><div id="roleTag" class="role-tag"></div><nav id="nav"></nav><div class="aside-footer"><button id="switchLang" class="ghost">English / العربية</button><button id="logout" class="ghost">تسجيل الخروج ↗</button></div></aside><div class="workspace"><header class="topbar"><button id="mobileMenu" class="ghost" aria-controls="appSidebar" aria-expanded="false" aria-label="فتح القائمة">☰</button><div><h2 id="pageTitle">لوحة التحكم</h2><p id="subtitle">إدارة الموارد البشرية من مكان واحد</p></div><div class="user-pill"><span class="avatar">●</span><strong id="username"></strong></div></header><main id="main"></main><footer>بوابة إحكام الأعمال — لكفاءات مستدامة وامتثال محكم</footer></div></div>
<dialog id="modal"><div class="modalhead"><h3 id="modalTitle"></h3><button id="closeModal" class="ghost">✕</button></div><div id="modalBody"></div></dialog>
